<div class="app-container">
  <!-- 1. 左固定 App Shell サイドバー -->
  <app-shell
    [activeView]="activeView"
    (viewChange)="onViewchange($event)"
    (toggleConcentrationMode)="onToggleConcentrationMode()">
  </app-shell>

  <!-- 2. 右側 メインエリア -->
  <div class="app-main-layout">
    <!-- グローバルヘッダー -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title" *ngIf="!selectedProject">BeSideFlow AI</h1>
        <button *ngIf="selectedProject" class="btn-back" (click)="onUnselectProject()">← プロジェクト一覧へ戻る</button>
        <button type="button" class="btn-add-project" (click)="onOpenNewProjectForm()">
          ＋ 親課題を追加
        </button>
      </div>

      <div class="header-center">
        <div class="view-switcher">
          <button
            type="button"
            [class.active]="currentMode === 'KANBAN'"
            (click)="switchViewMode('KANBAN')">
            カンバン
          </button>
          <button
            type="button"
            [class.active]="currentMode === 'GANTT'"
            (click)="switchViewMode('GANTT')">
            ガントチャート
          </button>
        </div>
      </div>

      <div class="header-right">
        <button type="button" class="theme-toggle-btn" (click)="onOpenArchiveModal()" title="アーカイブ一覧">
          📦 アーカイブ ( {{ archivedProjects.length }} )
        </button>
        <button type="button" class="theme-toggle-btn" (click)="toggleTheme()">
          {{ currentTheme === 'dark' ? '☀️ ライト' : '🌙 ダーク' }}
        </button>
      </div>
    </header>

    <!-- ★ メインコンテンツ領域 -->
    <main class="main-content">
      <ng-container *ngIf="activeView === 'tasks'">
        
        <!-- パターンA：親課題未選択時（全画面 親課題カンバン/ガント） -->
        <div class="full-master-pane" *ngIf="!selectedProject" style="display: flex; width: 100%; height: 100%;">
          <div style="flex: 1; height: 100%; min-width: 0; overflow: hidden;">
            <app-master-kanban-board
              *ngIf="currentMode === 'KANBAN'"
              [projects]="activeProjects"
              (selectProject)="onSelectProject($event)"
              (parentTaskUpdated)="onParentTaskUpdated($event)">
            </app-master-kanban-board>
        
            <app-gantt-board
              *ngIf="currentMode === 'GANTT'"
              [tasks]="[]"
              [project]="null"
              [projects]="activeProjects"
              (selectProject)="onSelectProject($event)"
              (selectTask)="onSelectTask($event)"
              (addTask)="onOpenNewTaskForm()"
              (projectUpdated)="onParentTaskUpdated($event)">
            </app-gantt-board>
          </div>
        
          <!-- 一覧画面での親課題フォーム右ドッキング -->
          <div class="docked-detail-pane" *ngIf="isProjectFormOpen" [style.width.px]="taskFormWidth">
            <div class="pane-resizer" (mousedown)="onResizeStart($event)"></div>
            <app-project-form
              [projectToEdit]="projectToEdit"
              (projectCreated)="onProjectCreated($event)"
              (projectUpdated)="onProjectUpdated($event)"
              (projectDeleted)="onProjectDeleted($event)"
              (closeModal)="onCloseProjectForm()">
            </app-project-form>
          </div>
        </div>

        <!-- パターンB：親課題選択時（全高ドッキングパネル構造） -->
        <div class="project-detail-layout" *ngIf="selectedProject">
          
          <!-- ★ 左〜中央エリア（サマリーカード ＋ ワークスペース） -->
          <div class="detail-main-area">
            <!-- 1. 上部親課題ヒーローカード -->
            <div class="project-summary-card">
              <div class="summary-top-row">
                <div class="summary-title-group">
                  <span class="project-badge">📁 親課題</span>
                  <h2 class="project-title-text">{{ selectedProject.title }}</h2>
                  <span class="status-chip" [attr.data-status]="selectedProject.status">
                    {{ selectedProject.status === 'done' ? '🟢 完了' : (selectedProject.status === 'in-progress' ? '🟡 進行中' : '🔴 未着手') }}
                  </span>
                </div>

                <div class="summary-actions">
                  <button type="button" class="btn-toggle-summary" (click)="isSummaryExpanded = !isSummaryExpanded">
                    {{ isSummaryExpanded ? '▲ 閉じる' : '▼ 概要・メモ' }}
                  </button>
                  <button type="button" class="btn-edit-project-icon" (click)="onEditProject()" title="親課題を編集">
                    ✏️
                  </button>
                </div>
              </div>

              <!-- 下段: 進捗メーター -->
              <div class="summary-bottom-row">
                <div class="progress-box">
                  <span class="progress-label">進捗率: {{ selectedProject.progressPercentage || 0 }}%</span>
                  <div class="progress-bar-bg">
                    <div class="progress-bar-fill" [style.width.%]="selectedProject.progressPercentage || 0"></div>
                  </div>
                </div>
              </div>

              <!-- サマリー展開領域 -->
              <div class="summary-expanded-content" *ngIf="isSummaryExpanded">
                <p class="project-desc" *ngIf="selectedProject.description">
                  <strong>概要:</strong> {{ selectedProject.description }}
                </p>
                <div class="doc-links-chips" *ngIf="selectedProject.docLinks && selectedProject.docLinks.length > 0">
                  <strong>関連資料:</strong>
                  <a *ngFor="let doc of selectedProject.docLinks" [href]="doc.url" target="_blank" class="doc-chip">
                    📎 {{ doc.title }}
                  </a>
                </div>
              </div>
            </div>

            <!-- 2. メイン ワークスペース (カンバン / ガント) -->
            <div class="workspace-body">
              <section class="main-board-pane">
                <app-kanban-board 
                  *ngIf="currentMode === 'KANBAN'"
                  [tasks]="currentTasks"
                  (selectTask)="onSelectTask($event)"
                  (addTask)="onOpenNewTaskForm()"
                  (taskUpdated)="onTaskUpdated($event)">
                </app-kanban-board>

                <app-gantt-board
                  *ngIf="currentMode === 'GANTT'"
                  [tasks]="currentTasks"
                  [project]="selectedProject"
                  [projects]="projects"
                  (selectTask)="onSelectTask($event)"
                  (selectProject)="onSelectProject($event)"
                  (addTask)="onOpenNewTaskForm()"
                  (taskUpdated)="onTaskUpdated($event)"
                  (projectUpdated)="onParentTaskUpdated($event)">
                </app-gantt-board>
              </section>
            </div>
          </div>

          <!-- ★ 右：全高ドッキング詳細パネル (ヒーローカードの横まで上いっぱいに全高化) -->
          <div class="docked-detail-pane" *ngIf="isTaskFormOpen || isProjectFormOpen" [style.width.px]="taskFormWidth">
            <!-- 可変幅リサイザーハンドル -->
            <div class="pane-resizer" (mousedown)="onResizeStart($event)"></div>
            
            <!-- 子タスクフォーム -->
            <app-task-form
              *ngIf="isTaskFormOpen"
              [taskToEdit]="taskToEdit"
              [projects]="projects"
              [projectId]="selectedProject.id"
              (taskCreated)="onTaskCreated($event)"
              (taskUpdated)="onTaskUpdated($event)"
              (taskDeleted)="onTaskDeleted($event)"
              (closePanel)="onCloseTaskForm()">
            </app-task-form>

            <!-- 親課題フォーム -->
            <app-project-form
              *ngIf="isProjectFormOpen"
              [projectToEdit]="projectToEdit"
              (projectCreated)="onProjectCreated($event)"
              (projectUpdated)="onProjectUpdated($event)"
              (projectDeleted)="onProjectDeleted($event)"
              (closeModal)="onCloseProjectForm()">
            </app-project-form>
          </div>

        </div>
      </ng-container>

      <!-- AIレビュー画面 -->
      <ng-container *ngIf="activeView === 'review'">
        <app-review-view
          [tasks]="allTasks"
          [autoCollect]="autoCollectDelayLog"
          (toggleAutoCollect)="onToggleAutoCollect($event)">
        </app-review-view>
      </ng-container>

      <!-- 最右端：サイドポケット引き出し -->
      <app-side-pocket-panel
        [projects]="projects"
        [selectedProject]="selectedProject"
        (promoteToTask)="onPromoteMemoToTask($event)"
        (promoteToProjectMemo)="onPromoteMemoToProjectMemo($event)">
      </app-side-pocket-panel>
    </main>

    <!-- モーダル類 -->
    <app-archive-modal
      *ngIf="isArchiveModalOpen"
      [archivedProjects]="archivedProjects"
      (closeModal)="onCloseArchiveModal()"
      (restoreProject)="onRestoreProject($event)"
      (deleteProject)="onProjectDeleted($event)">
    </app-archive-modal>

    <app-delay-log-toast
      *ngIf="autoCollectDelayLog && activeDelayLogInfo"
      [taskId]="activeDelayLogInfo.taskId"
      [taskTitle]="activeDelayLogInfo.taskTitle"
      [queueLength]="delayLogQueue.length"
      (selectReason)="onSelectDelayReason($event)"
      (skipAll)="onSkipAllDelayLogs()">
    </app-delay-log-toast>
  </div>
</div>
