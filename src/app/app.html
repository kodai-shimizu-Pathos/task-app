<div class="app-container">
  <!-- 1. 左固定 App Shell サイドバー -->
  <app-shell
    [activeView]="activeView"
    (viewChange)="onViewchange($event)"
    (toggleConcentrationMode)="onToggleConcentrationMode()">
  </app-shell>

  <!-- 2. 右側 メインエリア -->
  <div class="app-main-layout">
    <!-- グローバルヘッダー -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title" *ngIf="!selectedProject">BeSideFlow AI</h1>
        <div class="breadcrumb" *ngIf="selectedProject">
          <button class="btn-back" (click)="onUnselectProject()">← プロジェクト一覧</button>
          <span class="separator">></span>
          <span class="current-project">{{ selectedProject.title }}</span>
        </div>
        <button type="button" class="btn-add-project" (click)="onOpenNewProjectForm()">
          ＋ 親課題を追加
        </button>
      </div>

      <div class="header-center">
        <div class="view-switcher">
          <button
            type="button"
            [class.active]="currentMode === 'KANBAN'"
            (click)="switchViewMode('KANBAN')">
            カンバン
          </button>
          <button
            type="button"
            [class.active]="currentMode === 'GANTT'"
            (click)="switchViewMode('GANTT')">
            ガントチャート
          </button>
        </div>
      </div>

      <div class="header-right">
        <button type="button" class="theme-toggle-btn" (click)="toggleTheme()">
          {{ currentTheme === 'dark' ? '☀️ ライト' : '🌙 ダーク' }}
        </button>
      </div>
    </header>

    <!-- app.html の main タグ内 -->
    <main class="main-content">
      
      <!-- 1. 課題管理画面（activeView が 'tasks' の時） -->
      <ng-container *ngIf="activeView === 'tasks'">
        
        <!-- パターンA：親課題が未選択の時（全画面 Master UI） -->
        <div class="full-master-pane" *ngIf="!selectedProject">
          <app-master-kanban-board
            *ngIf="currentMode === 'KANBAN'"
            [projects]="projects"
            (selectProject)="onSelectProject($event)"
            (parentTaskUpdated)="onParentTaskUpdated($event)">
          </app-master-kanban-board>

          <app-gantt-board
            *ngIf="currentMode === 'GANTT'"
            [tasks]="currentTasks"
            [project]="selectedProject"
            [projects]="projects"
            (selectTask)="onSelectTask($event)"
            (addTask)="onOpenNewTaskForm()"
            (taskUpdated)="onTaskUpdated($event)"
            (projectUpdated)="onParentTaskUpdated($event)">
          </app-gantt-board>
        </div>

        <!-- パターンB：親課題が選択されている時（Master-Detail UI） -->
        <ng-container *ngIf="selectedProject">
          <!-- 左側: Master情報パネル -->
          <aside class="master-pane" [class.collapsed]="isMasterPanelCollapsed">
            <app-master-info-panel 
              [project]="selectedProject"
              [isCollapsed]="isMasterPanelCollapsed"
              (toggleCollapse)="toggleMasterPanel()"
              (editProject)="onEditProject()"
              (addTask)="onOpenNewTaskForm()">
            </app-master-info-panel>
          </aside>

          <!-- 右側: Detail表示エリア (子タスク カンバン/ガント) -->
          <section class="detail-pane">
            <app-kanban-board 
              *ngIf="currentMode === 'KANBAN'"
              [tasks]="currentTasks"
              (selectTask)="onSelectTask($event)"
              (addTask)="onOpenNewTaskForm()"
              (taskUpdated)="onTaskUpdated($event)">
            </app-kanban-board>

            <app-gantt-board
              *ngIf="currentMode === 'GANTT'"
              [tasks]="currentTasks"
              [project]="selectedProject"
              [projects]="projects"
              (selectTask)="onSelectTask($event)"
              (selectProject)="onSelectProject($event)"
              (addTask)="onOpenNewTaskForm()"
              (taskUpdated)="onTaskUpdated($event)">
            </app-gantt-board>
          </section>
        </ng-container>

      </ng-container>

      <!-- サイドポケット折り畳みパネル -->
      <app-side-pocket-panel
        [projects]="projects"
        [selectedProject]="selectedProject"
        (promoteToTask)="onPromoteMemoToTask($event)"
        (promoteToProjectMemo)="onPromoteMemoToProjectMemo($event)">
      </app-side-pocket-panel>
    </main>

    <!-- 子タスク作成・編集スライドインフォーム -->
    <app-task-form
      *ngIf="isTaskFormOpen"
      [taskToEdit]="taskToEdit"
      [projects]="projects"
      [projectId]="selectedProject?.id || ''"
      (taskCreated)="onTaskCreated($event)"
      (taskUpdated)="onTaskUpdated($event)"
      (taskDeleted)="onTaskDeleted($event)"
      (closePanel)="onCloseTaskForm()">
    </app-task-form>

    <!-- 親課題（Master）作成・編集モーダルフォーム -->
    <app-project-form
      *ngIf="isProjectFormOpen"
      [projectToEdit]="projectToEdit"
      (projectCreated)="onProjectCreated($event)"
      (projectUpdated)="onProjectUpdated($event)"
      (projectDeleted)="onProjectDeleted($event)"
      (closeModal)="onCloseProjectForm()">
    </app-project-form>
  </div>
</div>
