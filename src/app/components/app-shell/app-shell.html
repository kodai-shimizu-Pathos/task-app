<aside class="app-shell-sidebar">
    <div class="shell-logo" title="BeSideFlow AI">
      <span class="logo-icon">⚡</span>
    </div>
  
    <nav class="shell-nav">
      <!-- 1. 課題管理メイン画面 -->
      <button
        class="nav-btn"
        [class.active]="activeView === 'tasks'"
        (click)="onSelectView('tasks')"
        title="課題管理">
        <span class="icon">📁</span>
      </button>
  
      <!-- 2. レビュー画面 -->
      <button
        class="nav-btn"
        [class.active]="activeView === 'review'"
        (click)="onSelectView('review')"
        title="レビュー">
        <span class="icon">📝</span>
      </button>
    </nav>
  
    <div class="shell-footer">
      <!-- 3. 集中モード起動ボタン -->
      <button
        class="tool-btn concentration-btn"
        (click)="onToggleConcentrationMode()"
        title="集中モード (PiP)">
        <span class="icon">🎯</span>
      </button>
    </div>
  </aside>
