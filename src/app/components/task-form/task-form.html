<div class="side-panel-backdrop" (click)="onClose()">
    <div class="side-panel-container" (click)="$event.stopPropagation()">
        <div class="panel-header">
            <h2>{{ taskToEdit ? 'タスク詳細・編集' : '新規タスク作成' }}</h2>
            <button class="close-btn" (click)="onClose()" title="閉じる">✕</button>
        </div>

        <form (ngSubmit)="onSubmit()" class="panel-body">
            <!-- 親課題の選択 -->
            <div class="form-group">
                <label for="parentId">親課題<span class="required">*</span></label>
                <select [(ngModel)]="taskData.parentId" name="parentId" required>
                    <option *ngFor="let project of projects" [value]="project.id">{{ project.title }}</option>
                </select>
            </div>

            <!-- タスク名 -->
            <div class="form-group">
                <label for="title">タスク名<span class="required">*</span></label>
                <input type="text" [(ngModel)]="taskData.title" name="title" required placeholder="例: ログイン画面の実装" />
            </div>

            <!-- ステータス & 優先度 -->
            <div class="form-row">
                <div class="form-group">
                    <label>ステータス</label>
                    <select [(ngModel)]="taskData.status" name="status">
                        <option value="todo">🔴 未着手</option>
                        <option value="in-progress">🟡 進行中</option>
                        <option value="done">🟢 完了</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>優先度</label>
                    <select [(ngModel)]="taskData.priority" name="priority">
                        <option value="low">🔵 低</option>
                        <option value="medium">🟢 中</option>
                        <option value="high">🔴 高</option>
                    </select>
                </div>
            </div>

            <!-- スケジュール (開始予定日 & 完了予定日) -->
            <div class="form-row">
                <div class="form-group">
                    <label>作業開始予定日</label>
                    <input
                        type="date"
                        [(ngModel)]="taskData.scheduledStartDate"
                        name="scheduledStartDate"
                    />
                </div>

                <div class="form-group">
                    <label>作業完了予定日</label>
                    <input
                        type="date"
                        [(ngModel)]="taskData.scheduledEndDate"
                        name="scheduledEndDate"
                    />
                </div>
            </div>

            <!-- 締切日 -->
            <div class="form-group">
                <label>最終期限</label>
                <input
                    type="date"
                    [(ngModel)]="taskData.deadline"
                    name="deadline"
                />
            </div>

            <!-- タグ入力 -->
            <div class="form-group">
                <label>タグ (カンマ区切り)</label>
                <input
                    type="text"
                    [(ngModel)]="taskData.tags"
                    name="tags"
                    placeholder="例: UI設計, Angular"
                />
            </div>

            <!-- 説明 -->
            <div class="form-group">
                <label>説明・メモ</label>
                <textarea
                    [(ngModel)]="taskData.description"
                    name="description"
                    rows="4"
                    placeholder="タスクの詳細やメモを入力…"
                ></textarea>
            </div>

            <!-- フッター-->
            <div class="panel-footer">
                <button type="button" *ngIf="taskToEdit" class="btn-delete" (click)="onDelete()">🗑️ 削除</button>
                <div class="footer-right">
                    <button type="button" class="btn-cancel" (click)="onClose()">キャンセル</button>
                    <button type="submit" class="btn-submit">{{ taskToEdit ? '変更を保存' : 'タスクを作成' }}</button>
                </div>
            </div>
        </form>
    </div>
</div>
