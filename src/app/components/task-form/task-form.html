<div class="side-panel-backdrop" (click)="onClose()">
    <div class="side-panel-container" (click)="$event.stopPropagation()">
        <div class="panel-header">
            <h3>{{ taskToEdit ? 'タスク詳細・編集' : '新規タスク作成' }}</h3>
            <button class="close-btn" (click)="onClose()" title="閉じる">✕</button>
        </div>

        <div class="panel-body">
            <!-- タスク名 -->
             <div class="form-group">
                <label>タスク名 <span class="required">*</span></label>
                <input type="text" [(ngModel)]="title" placeholder="タスク名を入力" class="form-input" />
            </div>

            <!-- ステータス & 優先度 -->
            <div class="form-row">
                <div class="form-group half">
                    <label>ステータス</label>
                    <select [(ngModel)]="status" class="form-select">
                        <option value="todo">未着手 (TODO)</option>
                        <option value="in-progress">進行中 (IN PROGRESS)</option>
                        <option value="done">完了 (DONE)</option>
                    </select>
                </div>
                <div class="form-group half">
                    <label>優先度</label>
                    <select [(ngModel)]="priority" class="form-select">
                        <option value="high">高 (HIGH)</option>
                        <option value="medium">中 (MEDIUM)</option>
                        <option value="low">低 (LOW)</option>
                    </select>
                </div>
            </div>

            <!-- スケジュール (開始予定日 & 完了予定日) -->
            <div class="form-row">
                <div class="form-group half">
                    <label>作業開始予定日</label>
                    <input
                        type="date"
                        [(ngModel)]="scheduledStartDate"
                        class="form-input"
                        name="scheduledStartDate"
                    />
                </div>

                <div class="form-group half">
                    <label>作業完了予定日</label>
                    <input
                        type="date"
                        [(ngModel)]="scheduledEndDate"
                        class="form-input"
                        name="scheduledEndDate"
                    />
                </div>
             </div>

            <!-- 締切日 -->
            <div class="form-group">
                <label>最終期限</label>
                <input
                    type="date"
                    [(ngModel)]="deadline"
                    class="form-input"
                    name="deadline"
                />
            </div>

            <!-- タグ入力 -->
            <div class="form-group">
                <label>タグ (カンマ区切り)</label>
                <input
                    type="text"
                    [(ngModel)]="tagsString"
                    class="form-input"
                    name="tagsString"
                    placeholder="例: UI設計, Angular"
                />
            </div>

            <!-- 説明 -->
            <div class="form-group">
                <label>説明・メモ</label>
                <textarea
                    [(ngModel)]="description"
                    class="form-input"
                    name="description"
                    rows="3"
                    placeholder="タスクの詳細やメモを入力…"
                ></textarea>
             </div>

             <!-- フッター-->
            <div class="panel-footer">
                <button *ngIf="taskToEdit" type="button" class="btn-danger" (click)="onDelete()">🗑️タスクを削除</button>
                <div class="footer-right">
                    <button class="btn-submit" (click)="onSubmit()">{{ taskToEdit ? '更新' : '作成' }}</button>
                </div>
            </div>
        </div>
    </div>
</div>
