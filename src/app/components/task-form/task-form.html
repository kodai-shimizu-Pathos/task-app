<div class="modal-overlay" (click)="onClose()">
    <!-- (click.stop) でモーダル内のクリックが親 (オーバレイ) 要素に伝播しないようにする -->
     <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>新規タスク作成</h2>
            <button class="close-btn" (click)="onClose()">✕</button>
        </div>

        <form (ngSubmit)="onSubmit()">
            <!-- タスク名 -->
            <div class="form-group">
                <label for=""title>タスク名 <span class="required">*</span></label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    [(ngModel)]="title"
                    name="title"
                    placeholder="例: 仕様書を作成する"
                    required
                />
            </div>

            <!-- ステータス & 優先度 -->
            <div class="form-row">
                <div class="form-group">
                    <label for="status">ステータス</label>
                    <select id="status" [(ngModel)]="status" name="status">
                        <option value="todo">未着手 (TODO)</option>
                        <option value="in_progress">進行中 (IN PROGRESS)</option>
                        <option value="done">完了 (DONE)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">優先度</label>
                    <select id="priority" [(ngModel)]="priority" name="priority">
                        <option value="high">高 (HIGH)</option>
                        <option value="medium">中 (MEDIUM)</option>
                        <option value="low">低 (LOW)</option>
                    </select>
                </div>
            </div>

            <!-- スケジュール (開始予定日 & 完了予定日) -->
             <div class="form-row">
                <div class="form-group">
                    <label for="scheduledStartDate">開始予定日</label>
                    <input
                        type="date"
                        id="scheduledStartDate"
                        [(ngModel)]="scheduledStartDate"
                        name="scheduledStartDate"
                    />
                </div>

                <div class="form-group">
                    <label for="scheduledEndDate">完了予定日</label>
                    <input
                        type="date"
                        id="scheduledEndDate"
                        [(ngModel)]="scheduledEndDate"
                        name="scheduledEndDate"
                    />
                </div>
             </div>

            <!-- 締切日 -->
            <div class="form-group">
                <label for="deadline">締切日</label>
                <input
                    type="date"
                    id="deadline"
                    [(ngModel)]="deadline"
                    name="deadline"
                />
            </div>

            <!-- タグ入力 -->
            <div class="form-group">
                <label for="tags">タグ (カンマ区切り)</label>
                <input
                    type="text"
                    id="tags"
                    [(ngModel)]="tagsString"
                    name="tagsString"
                    placeholder="例: UI設計, Angular"
                />
            </div>

            <!-- 説明 -->
            <div class="form-group">
                <label for="description">説明・メモ (任意)</label>
                <textarea
                    id="description"
                    [(ngModel)]="description"
                    name="description"
                    rows="3"
                    placeholder="タスクの詳細やメモを入力…"
                ></textarea>
             </div>

            <!-- ボタンエリア -->
            <div class="modal-footer">
                <button type="button" class="btn-cancel" (click)="onClose()">キャンセル</button>
                <button type="submit" class="btn-submit">タスクを作成</button>
            </div>
        </form>
    </div>
</div>
