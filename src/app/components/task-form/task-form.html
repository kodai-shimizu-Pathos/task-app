<div class="side-panel-backdrop" (click)="onClose()">
    <div class="side-panel-container" (click)="$event.stopPropagation()">
        <div class="panel-header">
            <h2>{{ isEditMode ? 'タスク詳細・編集' : '新規タスク作成' }}</h2>
            <button type="button" class="close-btn" (click)="onClose()" title="閉じる">✕</button>
        </div>

        <form (ngSubmit)="onSubmit()" class="panel-body">
            <!-- 親課題の選択 -->
            <div class="form-group">
                <label for="parentId">親課題<span class="required">*</span></label>
                <select id="parentId" [(ngModel)]="taskData.parentId" name="parentId" required>
                    <option value="" disabled>-- 親課題を選択してください --</option>
                    <option *ngFor="let project of projects" [value]="project.id">
                        {{ project.title }}
                    </option>
                </select>
            </div>

            <!-- タスク名 -->
            <div class="form-group">
                <label for="title">タスク名<span class="required">*</span></label>
                <input type="text" id="title" [(ngModel)]="taskData.title" name="title" required placeholder="例: ログイン画面の実装" />
            </div>

            <!-- ステータス & 優先度 -->
            <div class="form-row">
                <div class="form-group">
                    <label for="status">ステータス</label>
                    <select id="status" [(ngModel)]="taskData.status" name="status">
                        <option value="todo">🔴 未着手</option>
                        <option value="in-progress">🟡 進行中</option>
                        <option value="done">🟢 完了</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="priority">優先度</label>
                    <select id="priority" [(ngModel)]="taskData.priority" name="priority">
                        <option value="low">🔵 低</option>
                        <option value="medium">🟢 中</option>
                        <option value="high">🔴 高</option>
                    </select>
                </div>
            </div>

            <!-- スケジュール -->
            <div class="form-row">
                <div class="form-group">
                    <label for="scheduledStartDate">作業開始予定日</label>
                    <input type="date" id="scheduledStartDate" [(ngModel)]="taskData.scheduledStartDate" name="scheduledStartDate" />
                </div>
                <div class="form-group">
                    <label for="scheduledEndDate">作業完了予定日</label>
                    <input type="date" id="scheduledEndDate" [(ngModel)]="taskData.scheduledEndDate" name="scheduledEndDate" />
                </div>
            </div>

            <!-- 締切日 -->
            <div class="form-group">
                <label for="deadline">最終期限</label>
                <input type="date" id="deadline" [(ngModel)]="taskData.deadline" name="deadline" />
            </div>

            <!-- タグ入力 -->
            <div class="form-group">
                <label for="tagsInput">タグ (カンマ区切り)</label>
                <input type="text" id="tagsInput" [(ngModel)]="tagsInput" name="tagsInput" placeholder="例: UI設計, Angular" />
            </div>

            <!-- 説明 -->
            <div class="form-group">
                <label for="description">説明・メモ</label>
                <textarea id="description" [(ngModel)]="taskData.description" name="description" rows="4" placeholder="タスクの詳細やメモを入力…"></textarea>
            </div>

            <!-- チェックリスト / サブタスク -->
            <div class="form-group">
                <label for="checklistInput">チェックリスト / サブタスク</label>
                <div class="checklist-input-row">
                    <input type="text" id="checklistInput" [(ngModel)]="checklistInput" name="checklistInput" placeholder="項目を入力…" (keydown.enter)="addChecklistItem($event)" />
                    <button type="button" class="btn-add-item" (click)="addChecklistItem()" title="項目を追加">＋ 追加</button>
                </div>

                <!-- チェックリスト項目一覧 -->
                <div class="checklist-items" *ngIf="taskData.checklist && taskData.checklist.length > 0">
                    <div class="checklist-item" *ngFor="let item of taskData.checklist" [class.completed]="item.completed">
                        <!-- チェックボックス：checked バインド + change イベント -->
                        <input type="checkbox" 
                               [id]="'item-' + item.id" 
                               [checked]="item.completed" 
                               (change)="toggleChecklistItem(item, $event)" 
                               class="checkbox-input" />
                        
                        <!-- テキストラベル：completed クラス + click イベント -->
                        <label [for]="'item-' + item.id" 
                               class="checklist-text" 
                               [class.completed]="item.completed"
                               (click)="toggleChecklistItem(item, $event)">
                            {{ item.text }}
                        </label>
                        
                        <!-- 削除ボタン -->
                        <button type="button" class="btn-delete-item" (click)="deleteChecklistItem(item.id)" title="削除">🗑️</button>
                    </div>
                </div>

                <!-- 進捗率表示（チェックリスト1件以上の場合） -->
                <div class="progress-info" *ngIf="taskData.checklist && taskData.checklist.length > 0">
                    <span class="progress-label">進捗:</span>
                    <span class="progress-value">{{ getCompletedChecklistCount() }} / {{ getTotalChecklistCount() }} ({{ taskData.progress || 0 }}%)</span>
                </div>
            </div>

            <!-- フッター -->
            <div class="panel-footer">
                <button type="button" *ngIf="isEditMode" class="btn-delete" (click)="onDelete()">🗑️ 削除</button>
                <div class="footer-right">
                    <button type="button" class="btn-cancel" (click)="onClose()">キャンセル</button>
                    <button type="submit" class="btn-submit">{{ isEditMode ? '変更を保存' : 'タスクを作成' }}</button>
                </div>
            </div>
        </form>
    </div>
</div>
