<div class="kanban-board-wrapper">
  <!-- ツールバー -->
  <div class="board-header">
    <div class="kanban-toolbar">
      
      <!-- 1. 検索ボックス -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          [(ngModel)]="searchKeyword"
          placeholder="タスクを検索..."
          class="filter-input-text" />
      </div>

      <!-- 2. 優先度フィルター -->
      <select [(ngModel)]="priorityFilter" class="filter-select">
        <option value="ALL">優先度： すべて</option>
        <option value="HIGH">優先度： 高</option>
        <option value="MEDIUM">優先度： 中</option>
        <option value="LOW">優先度： 低</option>
      </select>

      <!-- 3. ソート項目 -->
      <select [(ngModel)]="sortBy" class="filter-select">
        <option value="deadline">最終期限順</option>
        <option value="scheduledEndDate">完了予定日順</option>
        <option value="createdAt">作成日順</option>
        <option value="priority">優先度順</option>
      </select>

      <!-- 4. 昇順/降順切替 -->
      <button 
        type="button" 
        class="btn-sort-order" 
        (click)="toggleSortOrder()" 
        [title]="sortOrder === 'asc' ? '昇順（クリックで降順）' : '降順（クリックで昇順）'">
        {{ sortOrder === 'asc' ? '▲' : '▼' }}
      </button>

      <!-- 5. 選択中の複数アクティブタグチップ群 -->
      <div class="active-tags-container" *ngIf="selectedTags.length > 0">
        <div class="active-tag-chip" *ngFor="let tag of selectedTags">
          <span class="tag-label">#{{ tag }}</span>
          <button type="button" class="btn-clear-tag" (click)="removeTagFilter(tag)" title="このタグを解除">✕</button>
        </div>
      </div>

      <!-- 6. すべてリセットボタン -->
      <button
        *ngIf="isFilterActive"
        type="button"
        class="btn-reset-filter"
        (click)="resetAllFilters()"
        title="すべての検索・フィルター条件を初期状態に戻す">
        🔄 すべてリセット
      </button>

      <!-- ★ 7. ツールバー右端に配置された「＋ タスク」作成ボタン -->
      <button type="button" class="btn-add-task-toolbar" (click)="onAddTask()">
        ＋ タスク
      </button>

    </div>
  </div>

  <!-- カンバンエリア -->
  <div class="kanban-body" cdkDropListGroup>
    <app-kanban-column
      status="todo"
      title="未着手"
      headerColor="#64748B"
      [tasks]="todoTasks"
      (selectTask)="selectTask.emit($event)"
      (taskDropped)="onTaskDropped($event, 'todo')"
      (tagSelected)="onTagSelected($event)">
    </app-kanban-column>

    <app-kanban-column
      status="in-progress"
      title="進行中"
      headerColor="#2563EB"
      [tasks]="inProgressTasks"
      (selectTask)="selectTask.emit($event)"
      (taskDropped)="onTaskDropped($event, 'in-progress')"
      (tagSelected)="onTagSelected($event)">
    </app-kanban-column>

    <app-kanban-column
      status="done"
      title="完了"
      headerColor="#059669"
      [tasks]="doneTasks"
      (selectTask)="selectTask.emit($event)"
      (taskDropped)="onTaskDropped($event, 'done')"
      (tagSelected)="onTagSelected($event)">
    </app-kanban-column>
  </div>
</div>
