<div class="kanban-column-container" [ngClass]="status">
  <!-- カラムヘッダー -->
  <div class="column-header" [ngClass]="status" [style.border-top-color]="headerColor">
    <div class="header-left-group">
      <span class="status-indicator" [style.background-color]="headerColor"></span>
      <h3 class="column-title">{{ title }}</h3>
      <span class="task-count">{{ tasks.length }}</span>
    </div>
  
    <!-- ★ 追加：カラムヘッダーの「＋」追加ボタン -->
    <button type="button" class="btn-add-task-column" (click)="onAddTask($event)" title="この列にタスクを追加">
      ＋ タスク追加
    </button>
  </div>

  <!-- CdkDropList 領域 -->
  <div
    class="column-droplist"
    cdkDropList
    [id]="status"
    [cdkDropListConnectedTo]="['todo', 'in-progress', 'done']"
    [cdkDropListData]="tasks"
    (cdkDropListDropped)="onDrop($event)">
    
    <!-- ドラッグ可能タスクカード -->
    <div
      *ngFor="let task of tasks"
      cdkDrag
      [cdkDragData]="task"
      class="draggable-task-wrapper"
      (click)="onSelectTask(task)">

      <app-task-card [task]="task"></app-task-card>
    </div>

    <!-- カラムが空の時のプレースホルダー -->
    <div *ngIf="tasks.length === 0" class="empty-placeholder">
      タスクをここへドラッグ
    </div>
  </div>
</div>
