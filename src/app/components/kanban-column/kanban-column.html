<div class="kanban-column-container" [ngClass]="status">
  <!-- カラムヘッダー -->
  <div class="column-header">
    <div class="header-left-group">
      <span class="status-indicator" [style.background-color]="headerColor"></span>
      <h3 class="column-title">{{ title }}</h3>
      <span class="task-count">{{ tasks.length }}</span>
    </div>
  </div>

  <!-- CdkDropList 領域 -->
  <div
    class="column-droplist"
    cdkDropList
    [id]="status"
    [cdkDropListConnectedTo]="['todo', 'in-progress', 'done']"
    [cdkDropListData]="tasks"
    (cdkDropListDropped)="onDrop($event)">
    
    <div *ngFor="let task of tasks" cdkDrag [cdkDragData]="task" class="draggable-task-wrapper" (click)="onSelectTask(task)">
      <app-task-card
        [task]="task"
        (tagSelected)="onTagSelected($event)">
      </app-task-card>
    </div>

    <div *ngIf="tasks.length === 0" class="empty-placeholder">
      タスクをここへドラッグ
    </div>
  </div>
</div>
