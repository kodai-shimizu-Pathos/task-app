<div class="kanban-column-container" [ngClass]="status">
  <!-- カラムヘッダー -->
  <div class="column-header" [ngClass]="status" [style.border-top-color]="headerColor">
    <h3>{{ title }} <span class="task-count">({{ tasks.length }})</span></h3>
  </div>

  <!-- CdkDropList 領域 -->
  <div
    class="column-droplist"
    cdkDropList
    [id]="status"
    [cdkDropListData]="tasks"
    (cdkDropListDropped)="onDrop($event)">
    
    <!-- ドラッグ可能タスクカード -->
    <div
      *ngFor="let task of tasks"
      cdkDrag
      [cdkDragData]="task"
      class="draggable-task-wrapper">
      <app-task-card
        [task]="task"
        (click)="onSelectTask(task)">
      </app-task-card>
    </div>

    <!-- カラムが空の時のプレースホルダー -->
    <div *ngIf="tasks.length === 0" class="empty-placeholder">
      タスクをここへドラッグ
    </div>
  </div>
</div>
