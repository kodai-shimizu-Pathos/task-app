<div class="modal-backdrop" (click)="onClose()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ isSignUp ? '新規アカウント登録' : 'ログイン' }}</h2>
        <button type="button" class="close-btn" (click)="onClose()">✕</button>
      </div>
  
      <div class="modal-body">
        <!-- Google ログインボタン -->
        <button type="button" class="btn-google" (click)="onGoogleLogin()">
          <span class="google-icon">🌐</span> Google でログイン
        </button>
  
        <div class="divider"><span>または</span></div>
  
        <!-- Email / Password フォーム -->
        <form (ngSubmit)="onSubmitEmail()" class="email-form">
          <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="example@domain.com" required />
          </div>
  
          <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="6文字以上" required />
          </div>
  
          <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>
  
          <button type="submit" class="btn-submit">
            {{ isSignUp ? '登録してログイン' : 'ログイン' }}
          </button>
        </form>
  
        <!-- ログイン ↔ 新規登録 モード切替 -->
        <div class="toggle-mode">
          <button type="button" (click)="isSignUp = !isSignUp">
            {{ isSignUp ? 'すでにアカウントをお持ちの方 (ログイン)' : 'アカウントをお持ちでない方 (新規登録)' }}
          </button>
        </div>
      </div>
    </div>
  </div>
