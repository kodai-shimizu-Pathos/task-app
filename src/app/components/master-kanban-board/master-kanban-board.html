<div class="master-kanban-wrapper">
  <!-- ツールバー -->
  <div class="master-toolbar">
    <!-- 1. 検索ボックス -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        [(ngModel)]="searchKeyword"
        placeholder="親課題を検索..."
        class="filter-input-text"
      />
    </div>

    <!-- 2. 優先度フィルター -->
    <select [(ngModel)]="priorityFilter" class="filter-select">
      <option value="ALL">優先度：すべて</option>
      <option value="HIGH">優先度：高</option>
      <option value="MEDIUM">優先度：中</option>
      <option value="LOW">優先度：低</option>
    </select>
    
    <!-- 3. ソート項目選択 -->
    <select [(ngModel)]="sortBy" class="filter-select">
      <option value="deadline">最終期限順</option>
      <option value="scheduledEndDate">完了予定日順</option>
      <option value="createdAt">作成日順</option>
      <option value="priority">優先度順</option>
      <option value="progress">進捗度順</option>
    </select>

    <!-- 4. 昇順/降順切り替え -->
    <button (click)="toggleSortOrder()" class="btn-sort-order" title="昇順/降順切り替え">
      {{ sortOrder === 'asc' ? '▲' : '▼' }}
    </button>

    <!-- 5. 選択中の複数アクティブタグチップ群 -->
    <div class="active-tags-container" *ngIf="selectedTags.length > 0">
      <div class="active-tag-chip" *ngFor="let tag of selectedTags">
        <span class="tag-label">#{{ tag }}</span>
        <button type="button" class="btn-clear-tag" (click)="removeTagFilter(tag)" title="このタグを解除">✕</button>
      </div>
    </div>

    <!-- 6. 動的リセットボタン -->
    <button 
      *ngIf="isFilterActive"
      (click)="resetFilters()" 
      class="btn-reset-filter"
      title="すべての検索・フィルター条件を初期状態に戻す">
      🔄 すべてリセット
    </button>

    <!-- ★ 7. ツールバー右端に配置された「＋ 親課題」作成ボタン -->
    <button type="button" class="btn-add-project-toolbar" (click)="onOpenNewProjectForm()">
      ＋ 親課題
    </button>
  </div>

  <div class="master-kanban-container" cdkDropListGroup>
    <!-- 未着手 カラム -->
    <div class="master-column todo">
      <div class="column-header">
        <div class="header-left-group">
          <span class="status-indicator" style="background-color: #64748B;"></span>
          <span class="column-title">未着手</span>
          <span class="count-badge">{{ todoProjects.length }}</span>
        </div>
      </div>
      <div 
        class="column-droplist"
        cdkDropList
        [id]="'todo'"
        [cdkDropListData]="todoProjects"
        (cdkDropListDropped)="onProjectDropped($event, 'todo')">
        
        <div
          *ngFor="let project of todoProjects"
          cdkDrag
          [cdkDragData]="project"
          class="draggable-project-wrapper">
          <app-project-card
            [project]="project"
            (selectProject)="onSelectProject($event)"
            (tagSelected)="onTagSelected($event)">
          </app-project-card>
        </div>

        <div *ngIf="todoProjects.length === 0" class="empty-placeholder">
          親課題をここへドラッグ
        </div>
      </div>
    </div>

    <!-- 進行中 カラム -->
    <div class="master-column in-progress">
      <div class="column-header">
        <div class="header-left-group">
          <span class="status-indicator" style="background-color: #2563EB;"></span>
          <span class="column-title">進行中</span>
          <span class="count-badge">{{ inProgressProjects.length }}</span>
        </div>
      </div>
      <div 
        class="column-droplist"
        cdkDropList
        [id]="'in-progress'"
        [cdkDropListData]="inProgressProjects"
        (cdkDropListDropped)="onProjectDropped($event, 'in-progress')">
        
        <div
          *ngFor="let project of inProgressProjects"
          cdkDrag
          [cdkDragData]="project"
          class="draggable-project-wrapper">
          <app-project-card
            [project]="project"
            (selectProject)="onSelectProject($event)"
            (tagSelected)="onTagSelected($event)">
          </app-project-card>
        </div>

        <div *ngIf="inProgressProjects.length === 0" class="empty-placeholder">
          親課題をここへドラッグ
        </div>
      </div>
    </div>

    <!-- 完了 カラム -->
    <div class="master-column done">
      <div class="column-header">
        <div class="header-left-group">
          <span class="status-indicator" style="background-color: #059669;"></span>
          <span class="column-title">完了</span>
          <span class="count-badge">{{ doneProjects.length }}</span>
        </div>
      </div>
      <div 
        class="column-droplist"
        cdkDropList
        [id]="'done'"
        [cdkDropListData]="doneProjects"
        (cdkDropListDropped)="onProjectDropped($event, 'done')">
        
        <div
          *ngFor="let project of doneProjects"
          cdkDrag
          [cdkDragData]="project"
          class="draggable-project-wrapper">
          <app-project-card
            [project]="project"
            (selectProject)="onSelectProject($event)"
            (tagSelected)="onTagSelected($event)">
          </app-project-card>
        </div>

        <div *ngIf="doneProjects.length === 0" class="empty-placeholder">
          親課題をここへドラッグ
        </div>
      </div>
    </div>
  </div>
</div>
