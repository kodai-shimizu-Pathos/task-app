<div 
  class="task-card" 
  *ngIf="task" 
  [ngClass]="{
    'done-card': task.status === 'done',
    'overdue-scheduled': isScheduledOverdue() && !isDeadlineOverdue(),
    'overdue-deadline': isDeadlineOverdue()
  }" 
  (click)="onCardClick()">
  
  <!-- 1行目（上段）：【左】優先度 ＋ タイトル ／ 【右】タグ -->
  <div class="card-top-row">
    <div class="title-group">
      <span class="badge-priority" [ngClass]="'priority-' + (task.priority || 'medium').toLowerCase()">
        {{ getPriorityLabel(task.priority) }}
      </span>
      <h4 class="card-title" [title]="task.title">{{ task.title }}</h4>
    </div>

    <div class="task-tags" *ngIf="task.tags && task.tags.length > 0">
      <span
        *ngFor="let tag of task.tags"
        class="tag-chip clickable-tag"
        (click)="onTagClick($event, tag)"
        title="このタグでフィルター">
        #{{ tag }}
      </span>
    </div>
  </div>

  <!-- 2行目（下段）：【左】完了予定 ＆ 最終期限 ／ 【右】サブタスク進捗 -->
  <div class="card-bottom-row" *ngIf="task.scheduledEndDate || task.deadline || hasChecklist()">
    <div class="date-badges-group">
      
      <!-- 1. 完了予定日 -->
      <span class="date-chip chip-scheduled" *ngIf="task.scheduledEndDate" [class.overdue]="isScheduledOverdue()">
        <span class="chip-label">完了予定</span>
        <span class="chip-val">{{ task.scheduledEndDate }}</span>
      </span>

      <!-- 2. 最終期限 -->
      <span class="date-chip chip-deadline" *ngIf="task.deadline" [class.overdue]="isDeadlineOverdue()">
        <span class="chip-label">最終期限</span>
        <span class="chip-val">{{ task.deadline }}</span>
      </span>

    </div>

    <!-- 右下：サブタスク進捗 -->
    <div class="checklist-compact" *ngIf="hasChecklist()">
      <span class="stats">☑ {{ getChecklistStats().completed }}/{{ getChecklistStats().total }}</span>
    </div>
  </div>
</div>
