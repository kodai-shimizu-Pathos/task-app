<div class="gantt-board-wrapper">
    <!-- ヘッダーコントロールバー -->
    <div class="gantt-header-bar">
        <div class="header-left">
            <h3 class="gantt-title">📊 ガントチャート</h3>
        </div>

        <div class="header-controls">
            <!-- ズーム機能 -->
            <div class="zoom-controls">
                <button type="button" class="zoom-btn" (click)="onZoomOut()" title="ズームアウト">➖</button>
                <span class="zoom-label">{{ columnWidth }}px</span>
                <button type="button" class="zoom-btn" (click)="onZoomIn()" title="ズームイン">➕</button>
            </div>

            <!-- 今日へのスクロールボタン -->
            <button type="button" class="btn-today" (click)="onScrollToToday()" title="本日の位置へスクロール">📍 今日</button>

            <!-- 新規タスク追加 -->
            <button type="button" class="btn-primary" (click)="onAddNewTask()">＋ 新規タスク</button>
        </div>
    </div>

    <!-- メイン表示エリア -->
    <div class="gantt-main-container">
        <!-- 左列: WBS領域 -->
        <div class="wbs-pane" [style.width.px]="wbsWidth">
            <div class="wbs-header">
                <div class="col-title">課題 / タスク名（WBS）</div>
                <div class="col-priority">優先度</div>
            </div>

            <div class="wbs-body">
                <!-- 親課題行（クリックで選択可能） -->
                <div class="wbs-row parent-row" *ngIf="project" (click)="onProjectClick(project, $event)">
                    <div class="col-title">
                        <span class="tree-icon">📂</span>
                        <span class="title-text">{{ project.title }}</span>
                    </div>
                    <div class="col-priority">
                        <span class="badge-priority" [ngClass]="'priority-' + (project.priority | lowercase)">
                            {{ getPriorityLabel(project.priority) }}
                        </span>
                    </div>
                </div>

                <!-- 子タスク行一覧 -->
                <div *ngFor="let task of tasks" class="wbs-row task-row" [class.is-overdue]="isTaskOverdue(task)" (click)="onTaskClick(task, $event)">
                    <div class="col-title">
                        <span class="tree-indent"> └ ♦ </span>
                        <span class="title-text" [class.done-text]="task.status === 'done'">{{ task.title }}</span>
                        <span *ngIf="isTaskOverdue(task)" class="overdue-alert" title="期限超過">⚠️</span>
                    </div>
                    <div class="col-priority">
                        <span class="badge-priority" [ngClass]="'priority-' + (task.priority | lowercase)">
                            {{ getPriorityLabel(task.priority) }}
                        </span>
                    </div>
                </div>

                <div *ngIf="tasks.length === 0" class="empty-wbs">
                    子タスクが登録されていません
                </div>
            </div>
        </div>

        <!-- スプリッター（WBS と Timeline の可動境界線） -->
        <div class="splitter" (mousedown)="onSplitterMouseDown($event)" [class.active]="isResizing" title="ドラッグして WBS の幅を変更"></div>

        <!-- 右列: タイムライン領域 -->
        <div class="timeline-pane" #timelinePane (wheel)="onTimelineWheel($event)" (scroll)="onTimelineScroll($event)">
            <div class="timeline-header">
                <div *ngFor="let col of timelineColumns" class="date-col-header" [style.width.px]="columnWidth" [class.today-col]="col.isToday">
                    <span class="date-label">{{ col.label }}</span>
                    <span class="day-of-week">{{ col.dayOfWeek }}</span>
                </div>
            </div>

            <div class="timeline-body">
                <!-- 親課題行 (背景) -->
                <div class="timeline-row parent-row" *ngIf="project">
                    <div *ngFor="let col of timelineColumns" class="grid-cell" [style.width.px]="columnWidth" [class.today-cell]="col.isToday"></div>
                </div>

                <!-- 子タスク行 -->
                <div *ngFor="let task of tasks" class="timeline-row task-row" (click)="onTaskClick(task, $event)">
                    <div *ngFor="let col of timelineColumns" class="grid-cell" [style.width.px]="columnWidth" [class.today-cell]="col.isToday"></div>

                    <ng-container *ngIf="getTaskBarPositionPx(task) as bar">
                        <div *ngIf="bar.visible"
                            class="gantt-bar"
                            [ngClass]="[task.status, 'priority-' + (task.priority | lowercase)]"
                            [class.is-overdue]="isTaskOverdue(task)"
                            [style.left.px]="bar.left"
                            [style.width.px]="bar.width"
                            (mousedown)="onBarMouseDown(task, $event, 'move')">
                            
                            <!-- バー左端のリサイズハンドル -->
                            <div class="resize-handle resize-left" (mousedown)="onBarMouseDown(task, $event, 'resize-left')" title="ドラッグして開始日を変更"></div>

                            <span class="bar-label">{{ task.title }}</span>

                            <!-- 完了予定日フラグマーカー -->
                            <span *ngIf="task.scheduledEndDate" class="scheduled-end-marker"
                                [style.left.px]="getScheduledEndPositionPx(task) - bar.left"
                                (mousedown)="onFlagMouseDown(task, $event)"
                                title="ドラッグして完了予定日を変更： {{ task.scheduledEndDate }}">🚩</span>

                            <!-- バー右端のリサイズハンドル -->
                            <div class="resize-handle resize-right" (mousedown)="onBarMouseDown(task, $event, 'resize-right')" title="ドラッグして期限を変更"></div>
                        </div>
                    </ng-container>
                </div>
            </div>
        </div>
    </div>
</div>
